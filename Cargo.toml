[package]
name = "ferry"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Carry an Arch KDE desktop's mouse and keyboard over to a Mac, with clipboard sync"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "signal", "process", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chacha20poly1305 = "0.10"
getrandom = "0.3"
sha2 = "0.10"
tracing-appender = "0.2"
spake2 = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "input_capture"] }
reis = { version = "0.7", features = ["tokio"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
futures-util = "0.3"
evdev = "0.13"
wl-clipboard-rs = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSData", "NSArray"] }
objc2-app-kit = { version = "0.3", features = ["NSPasteboard", "NSPasteboardItem", "NSImage", "NSImageRep", "NSBitmapImageRep"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
